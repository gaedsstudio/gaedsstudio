name: SafeScan APK

on:
  push:
    branches:
      - safescan-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SafeScan source
        shell: bash
        run: |
          set -euxo pipefail
          cat safescan_payload/part* > /tmp/safescan-source.b64
          test "$(wc -c < /tmp/safescan-source.b64)" -eq 30380
          base64 --decode /tmp/safescan-source.b64 > /tmp/SafeScan-source.zip
          unzip -t /tmp/SafeScan-source.zip
          unzip -q /tmp/SafeScan-source.zip
          test -f safescan_project/lib/main.dart
          test -f safescan_project/pubspec.yaml
          sha256sum /tmp/SafeScan-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        working-directory: safescan_project
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/Icons\.shield_lock_outlined/Icons.lock_outline_rounded/g' lib/main.dart
          sed -i "/import 'dart:typed_data';/d" lib/main.dart
          sed -i "/import 'dart:ui' as ui;/d" lib/main.dart
          sed -i 's/DropdownButtonFormField<String>(value:expiry/DropdownButtonFormField<String>(initialValue:expiry/g' lib/main.dart

          cp lib/main.dart /tmp/safescan-main.dart
          cp pubspec.yaml /tmp/safescan-pubspec.yaml

          flutter create . --platforms=android --org org.safescan --project-name safescan

          cp /tmp/safescan-main.dart lib/main.dart
          cp /tmp/safescan-pubspec.yaml pubspec.yaml
          cp -r android_override/app/src/main/* android/app/src/main/
          rm -f android/app/src/main/kotlin/org/safescan/safescan/MainActivity.kt

          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 26")
          s = s.replace('namespace = "org.safescan.safescan"', 'namespace = "org.safescan.app"')
          s = s.replace('applicationId = "org.safescan.safescan"', 'applicationId = "org.safescan.app"')
          marker = "release {"
          if marker in s and '"proguard-rules.pro"' not in s:
              s = s.replace(
                  marker,
                  marker + """
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro",
            )""",
                  1,
              )
          p.write_text(s)
          PY

          grep -nE 'namespace|applicationId|minSdk|proguard' android/app/build.gradle.kts
          grep -R '^package org.safescan.app' -n android/app/src/main/kotlin/org/safescan/app/MainActivity.kt

      - name: Resolve dependencies
        working-directory: safescan_project
        run: flutter pub get

      - name: Analyze Dart
        working-directory: safescan_project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart

      - name: Build release APKs
        working-directory: safescan_project
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Verify APK permissions
        working-directory: safescan_project
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          mkdir -p build/verification
          : > build/verification/permissions.txt

          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*-release.apk)
          test ${#apks[@]} -gt 0

          for apk in "${apks[@]}"; do
            echo "===== $(basename "$apk") =====" | tee -a build/verification/permissions.txt
            "$AAPT" dump permissions "$apk" | tee -a build/verification/permissions.txt

            if "$AAPT" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "ERROR: INTERNET permission found in $(basename "$apk")"
              exit 1
            fi

            EXTRA="$("$AAPT" dump permissions "$apk"               | sed -n "s/.*name='\([^']*\)'.*/\1/p"               | grep '^android.permission.'               | grep -v '^android.permission.CAMERA$' || true)"

            if [ -n "$EXTRA" ]; then
              echo "ERROR: unexpected Android permissions in $(basename "$apk"):"
              echo "$EXTRA"
              exit 1
            fi
          done

      - name: Record SHA-256
        working-directory: safescan_project
        run: |
          sha256sum build/app/outputs/flutter-apk/*-release.apk             | tee build/verification/sha256.txt

      - name: Upload release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeScan-release
          if-no-files-found: warn
          retention-days: 30
          path: |
            safescan_project/build/app/outputs/flutter-apk/*-release.apk
            safescan_project/build/verification/permissions.txt
            safescan_project/build/verification/sha256.txt
