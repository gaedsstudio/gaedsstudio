name: SafeScan Camera Hotfix

on:
  push:
    branches:
      - safescan-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore known-good SafeScan source
        shell: bash
        run: |
          set -euxo pipefail
          cat safescan_payload/part00 safescan_payload/part01 safescan_payload/part02 safescan_payload/part03 safescan_payload/part04 safescan_payload/part05 safescan_payload/part06 > /tmp/safescan-source.b64
          test "$(wc -c < /tmp/safescan-source.b64)" -eq 30380
          base64 --decode /tmp/safescan-source.b64 > /tmp/SafeScan-source.zip
          unzip -t /tmp/SafeScan-source.zip
          rm -rf safescan_project
          unzip -q /tmp/SafeScan-source.zip
          test -f safescan_project/lib/main.dart
          test -f safescan_project/pubspec.yaml

      - name: Apply camera crash hotfix
        working-directory: safescan_project
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          s = p.read_text()
          s = s.replace("  camera: any\n", "  camera: 0.12.1\n  camera_android: 0.10.11+1\n")
          p.write_text(s)

          p = Path("lib/main.dart")
          s = p.read_text()
          s = s.replace("Icons.shield_lock_outlined", "Icons.lock_outline_rounded")
          s = s.replace("import 'dart:typed_data';\n", "")
          s = s.replace("import 'dart:ui' as ui;\n", "")
          s = s.replace(
              "DropdownButtonFormField<String>(value:expiry",
              "DropdownButtonFormField<String>(initialValue:expiry",
          )
          s = s.replace(
              "final c = controller; if (c == null || !c.value.isInitialized) return;",
              "final c = controller; if (busy || c == null || !c.value.isInitialized || c.value.isTakingPicture) return;",
          )
          p.write_text(s)
          PY
          grep -nE 'camera:|camera_android:' pubspec.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: safescan_project
        shell: bash
        run: |
          set -euxo pipefail
          cp lib/main.dart /tmp/safescan-main.dart
          cp pubspec.yaml /tmp/safescan-pubspec.yaml
          flutter create . --platforms=android --org org.safescan --project-name safescan
          cp /tmp/safescan-main.dart lib/main.dart
          cp /tmp/safescan-pubspec.yaml pubspec.yaml
          cp -r android_override/app/src/main/* android/app/src/main/
          rm -f android/app/src/main/kotlin/org/safescan/safescan/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 26")
          s = s.replace('namespace = "org.safescan.safescan"', 'namespace = "org.safescan.app"')
          s = s.replace('applicationId = "org.safescan.safescan"', 'applicationId = "org.safescan.app"')
          p.write_text(s)
          PY
          grep -nE 'namespace|applicationId|minSdk' android/app/build.gradle.kts

      - name: Resolve dependencies
        working-directory: safescan_project
        run: |
          flutter pub get
          flutter pub deps | grep -E 'camera(_android|_android_camerax)? ' || true

      - name: Analyze Dart
        working-directory: safescan_project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart

      - name: Build release APKs
        working-directory: safescan_project
        run: flutter build apk --release --split-per-abi

      - name: Verify APK permissions
        working-directory: safescan_project
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          mkdir -p build/verification
          : > build/verification/permissions.txt

          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*-release.apk)
          test ${#apks[@]} -gt 0

          for apk in "${apks[@]}"; do
            echo "===== $(basename "$apk") =====" | tee -a build/verification/permissions.txt
            "$AAPT" dump permissions "$apk" | tee -a build/verification/permissions.txt
            if "$AAPT" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "ERROR: INTERNET permission found"
              exit 1
            fi
            EXTRA="$("$AAPT" dump permissions "$apk" | sed -n "s/.*name='\([^']*\)'.*/\1/p" | grep '^android.permission.' | grep -v '^android.permission.CAMERA$' || true)"
            if [ -n "$EXTRA" ]; then
              echo "ERROR: unexpected Android permissions: $EXTRA"
              exit 1
            fi
          done

      - name: Checksums
        working-directory: safescan_project
        run: sha256sum build/app/outputs/flutter-apk/*-release.apk | tee build/verification/SHA256SUMS.txt

      - name: Upload hotfix artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeScan-camera-hotfix
          if-no-files-found: error
          retention-days: 30
          path: |
            safescan_project/build/app/outputs/flutter-apk/*-release.apk
            safescan_project/build/verification/permissions.txt
            safescan_project/build/verification/SHA256SUMS.txt
