name: Build SafeScan Hotfix APK
on:
  push:
    branches: ['safescan-build']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore SafeScan source
        run: |
          set -euxo pipefail
          rm -rf lib android pubspec.yaml README.md android_override
          unzip -o safescan_ci_source.zip

      - name: Patch capture/OCR crash handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/main.dart')
          s=p.read_text()
          s=s.replace("import 'dart:typed_data';\n","")
          s=s.replace("import 'dart:ui' as ui;\n","")
          s=s.replace("Icons.shield_lock_outlined","Icons.lock_outline_rounded")
          s=s.replace("DropdownButtonFormField<String>(value:expiry","DropdownButtonFormField<String>(initialValue:expiry")

          pattern=r"""  static Future<ProcessedScan> process\(String source,\{required ScanMode mode,required ScanFilter filter\}\) async \{.*?\n  \}\n\n  static Future<Uint8List> buildPdf"""
          replacement=r'''  static Future<ProcessedScan> process(String source,{required ScanMode mode,required ScanFilter filter}) async {
            RecognizedText? recognized;
            TextRecognizer? recognizer;
            try {
              recognizer = TextRecognizer(script: TextRecognitionScript.latin);
              recognized = await recognizer.processImage(InputImage.fromFilePath(source));
            } catch (_) {
              // OCR is best-effort. A camera capture must never be discarded because
              // the on-device recognizer failed to initialize on a specific device.
              recognized = null;
            } finally {
              try { recognizer?.close(); } catch (_) {}
            }

            final input = await File(source).readAsBytes();
            var image = img.decodeImage(input);
            if(image==null) return ProcessedScan(source,recognized?.text ?? '',false);
            if(filter==ScanFilter.enhance) image = img.adjustColor(image, contrast:1.22, saturation:0.92);
            if(filter==ScanFilter.mono) image = img.grayscale(image);

            bool sensitive=false;
            final safeText=<String>[];
            if (recognized != null) {
              for(final block in recognized.blocks){
                for(final line in block.lines){
                  for(final e in line.elements){
                    final hit=SensitiveDetector.isSensitive(e.text);
                    if(hit) sensitive=true;
                    if(mode==ScanMode.secure && hit){
                      final r=e.boundingBox;
                      final pad=math.max(6,(r.height*.18).round());
                      img.fillRect(
                        image,
                        x1:math.max(0,r.left.floor()-pad),
                        y1:math.max(0,r.top.floor()-pad),
                        x2:math.min(image.width-1,r.right.ceil()+pad),
                        y2:math.min(image.height-1,r.bottom.ceil()+pad),
                        color:img.ColorRgb8(18,18,18),
                      );
                    } else {
                      safeText.add(e.text);
                    }
                  }
                }
              }
            }
            final out='${source}_processed.jpg';
            await File(out).writeAsBytes(img.encodeJpg(image,quality:90),flush:true);
            return ProcessedScan(out,safeText.join(' '),sensitive);
          }

          static Future<Uint8List> buildPdf'''
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n != 1:
              raise SystemExit(f'process patch count={n}')
          p.write_text(s2)
          PY
          grep -n "OCR is best-effort" lib/main.dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          set -euxo pipefail
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -R android_override /tmp/android_override
          flutter create . --platforms=android --org org.safescan --project-name safescan
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf android/app/src/main
          mkdir -p android/app/src/main
          cp -R /tmp/android_override/app/src/main/* android/app/src/main/

          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 26')
          # Hotfix: disable Java/Kotlin shrinking/obfuscation so CameraX and ML Kit
          # cannot be broken by R8 and any remaining native stack trace is readable.
          s=s.replace('release {', 'release {\n            isMinifyEnabled = false\n            isShrinkResources = false', 1)
          p.write_text(s)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart

      - name: Build hotfix split APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK permissions
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          mkdir -p build/verification
          : > build/verification/permissions.txt
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "===== $(basename "$apk") =====" | tee -a build/verification/permissions.txt
            "$AAPT" dump permissions "$apk" | tee -a build/verification/permissions.txt
            if "$AAPT" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "ERROR: INTERNET permission found"
              exit 1
            fi
            EXTRA=$("$AAPT" dump permissions "$apk" | sed -n "s/.*name='\([^']*\)'.*/\1/p" | grep '^android.permission.' | grep -v '^android.permission.CAMERA$' || true)
            if [ -n "$EXTRA" ]; then
              echo "ERROR: unexpected permissions: $EXTRA"
              exit 1
            fi
          done

      - name: Checksums
        run: sha256sum build/app/outputs/flutter-apk/*-release.apk | tee build/verification/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SafeScan-hotfix
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/verification/permissions.txt
            build/verification/SHA256SUMS.txt
